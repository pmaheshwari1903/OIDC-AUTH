<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maheshwari Identity | Sign In</title>
    <meta
      name="description"
      content="Professional sign-in experience for Maheshwari Identity"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card" aria-labelledby="signin-title">
        <div class="brand-mark" aria-hidden="true">
          <img src="./assets/maheshwari-identity-logo.svg" alt="" />
        </div>

        <h1 id="signin-title">Sign in</h1>
        <p class="subtitle">Continue to Maheshwari Identity</p>

        <form class="sign-in-form" novalidate>
          <div class="field-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <div class="field-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="password-toggle" aria-label="Show password">
                Show
              </button>
            </div>
          </div>

          <button class="primary-btn" type="submit">Sign In</button>
          <a class="text-btn" href="./sign-up.html">Create Account</a>
        </form>

        <p class="status-message" aria-live="polite"></p>

        <footer class="footer-links">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
        </footer>
      </section>
    </main>

    <script src="./js/sign-in.js"></script>
  </body>
</html>
