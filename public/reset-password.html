<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maheshwari Identity | Create New Password</title>
    <meta
      name="description"
      content="Create a new password for Maheshwari Identity"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card" aria-labelledby="reset-title">
        <div class="brand-mark" aria-hidden="true">
          <img src="/assets/maheshwari-identity-logo.svg" alt="" />
        </div>

        <h1 id="reset-title">Set new password</h1>
        <p class="subtitle">Please enter your new password below</p>

        <form class="sign-in-form" novalidate id="reset-password-form">
          <div class="field-group">
            <label for="password">New Password</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                required
                minlength="6"
              />
              <button type="button" class="password-toggle" aria-label="Show password">
                Show
              </button>
            </div>
            <p class="helper-text">Must be at least 6 characters.</p>
          </div>

          <button class="primary-btn" type="submit">Update Password</button>
          <a class="text-btn" href="/sign-in.html">Return to Sign In</a>
        </form>

        <p class="status-message" aria-live="polite" id="statusMessage"></p>
      </section>
    </main>

    <script>
      const form = document.getElementById('reset-password-form');
      const passwordInput = document.getElementById('password');
      const toggleButton = document.querySelector('.password-toggle');
      const statusMessage = document.getElementById('statusMessage');

      if (toggleButton) {
        toggleButton.addEventListener('click', () => {
          const isPassword = passwordInput.type === 'password';
          passwordInput.type = isPassword ? 'text' : 'password';
          toggleButton.textContent = isPassword ? 'Hide' : 'Show';
          toggleButton.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
        });
      }

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');

      if (!token) {
        statusMessage.style.color = '#dc2626';
        statusMessage.textContent = 'Invalid or missing reset token.';
        form.querySelector('.primary-btn').disabled = true;
        form.querySelector('.primary-btn').classList.add('disabled-btn');
      }

      if (form && token) {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const newPassword = passwordInput.value.trim();
          const submitBtn = form.querySelector('.primary-btn');

          if (!newPassword || newPassword.length < 6) {
            statusMessage.style.color = '#dc2626';
            statusMessage.textContent = 'Password must be at least 6 characters.';
            return;
          }

          try {
            statusMessage.style.color = 'var(--primary)';
            statusMessage.textContent = 'Updating...';
            submitBtn.disabled = true;
            submitBtn.classList.add('disabled-btn');
            
            const response = await fetch('/api/auth/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token, newPassword })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
              throw new Error(data.message || 'Failed to process request');
            }
            
            statusMessage.style.color = '#16a34a';
            statusMessage.textContent = data.message;
            form.reset();
            
            setTimeout(() => {
              window.location.href = '/sign-in.html';
            }, 2000);
          } catch (err) {
            statusMessage.style.color = '#dc2626';
            statusMessage.textContent = err.message;
            submitBtn.disabled = false;
            submitBtn.classList.remove('disabled-btn');
          }
        });
      }
    </script>
  </body>
</html>
