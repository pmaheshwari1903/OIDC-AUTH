<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maheshwari Identity | Forgot Password</title>
    <meta
      name="description"
      content="Reset your password for Maheshwari Identity"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card" aria-labelledby="forgot-title">
        <div class="brand-mark" aria-hidden="true">
          <img src="./assets/maheshwari-identity-logo.svg" alt="" />
        </div>

        <h1 id="forgot-title">Reset password</h1>
        <p class="subtitle">Enter your email and we'll send a reset link</p>

        <form class="sign-in-form" novalidate id="forgot-password-form">
          <div class="field-group">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>

          <button class="primary-btn" type="submit">Send Reset Link</button>
          <a class="text-btn" href="./sign-in.html">Return to Sign In</a>
        </form>

        <p class="status-message" aria-live="polite" id="statusMessage"></p>
      </section>
    </main>

    <script>
      const form = document.getElementById('forgot-password-form');
      const statusMessage = document.getElementById('statusMessage');

      if (form) {
        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const email = document.getElementById('email').value.trim();
          const submitBtn = form.querySelector('.primary-btn');

          if (!email) {
            statusMessage.style.color = '#dc2626';
            statusMessage.textContent = 'Please enter your email.';
            return;
          }

          try {
            statusMessage.style.color = 'var(--primary)';
            statusMessage.textContent = 'Sending...';
            submitBtn.disabled = true;
            submitBtn.classList.add('disabled-btn');
            
            const response = await fetch('/api/auth/forgot-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email })
            });
            
            const data = await response.json();
            
            if (!response.ok) {
              throw new Error(data.message || 'Failed to process request');
            }
            
            statusMessage.style.color = '#16a34a';
            statusMessage.textContent = data.message;
            form.reset();
          } catch (err) {
            statusMessage.style.color = '#dc2626';
            statusMessage.textContent = err.message;
          } finally {
            submitBtn.disabled = false;
            submitBtn.classList.remove('disabled-btn');
          }
        });
      }
    </script>
  </body>
</html>
